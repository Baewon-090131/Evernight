name: Evernight

options:
  bundleIdPrefix: com.evernight
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Evernight:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Evernight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.evernight.gallerysorter
        PRODUCT_NAME: Evernight
        MARKETING_VERSION: "0.2"
        CURRENT_PROJECT_VERSION: "2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "长夜月"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Evernight 需要读取照片和视频，帮助你在本机按月整理相册。"
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Evernight 需要向相簿添加媒体，并执行你确认过的删除操作。"
        INFOPLIST_KEY_NSPhotoLibraryPreventAutomaticLimitedAccessAlert: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
    scheme:
      gatherCoverageData: true
      testTargets:
        - EvernightTests

  EvernightTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - EvernightTests
    dependencies:
      - target: Evernight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.evernight.gallerysorter.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Evernight.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Evernight"
        BUNDLE_LOADER: "$(TEST_HOST)"
